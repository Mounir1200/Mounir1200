# From git-koi's examples/profile-workflow.yml, with the asagi body.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yalongwastaken/git-koi@v1
        with:
          body: asagi
          output-dir: koi
      # The README shows the koi at full width, so double it pixel for pixel
      # (no smoothing) to keep the pixel art sharp when it is scaled up.
      - name: Enlarge the koi without blurring it
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gifsicle
          gifsicle --resize-method sample --scale 2 -O2 koi/koi.gif -o koi/koi.gif
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
